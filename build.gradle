plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '4.0.1'
}

group 'co.sqasa'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    serenityVersion = '4.0.1'
    cucumberVersion = '7.14.0'
    junitVersion = '5.10.0'
}

dependencies {

    implementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-ensure:${serenityVersion}"
    implementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
    testImplementation 'junit:junit:4.13.1'

    testImplementation "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation "org.junit.platform:junit-platform-suite:1.10.0"

    testImplementation 'org.assertj:assertj-core:3.24.2'

    implementation 'org.slf4j:slf4j-simple:2.0.9'
}

test {
    useJUnitPlatform()
    testLogging.showStandardStreams = true
    systemProperties System.properties

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

gradle.startParameter.continueOnFailure = true

serenity {
    reports = ["single-page-html"]
    projectKey = "DATEPICKER"
    requirementsBaseDir = "src/test/resources/features"
}

tasks.named('test') {
    finalizedBy 'aggregate'
}