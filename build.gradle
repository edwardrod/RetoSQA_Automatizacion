plugins {
    id 'java'
    id 'jacoco'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '4.2.34'
    id 'org.sonarqube' version '6.2.0.5505'
}

group = 'co.com.sqa.reto'
version = '1.0.0'
repositories { mavenCentral() }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
ext.serenityVersion = '4.2.34'
dependencies {
    implementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-junit:${serenityVersion}"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test {
    useJUnit()
    maxParallelForks = 1
    systemProperty 'file.encoding', 'UTF-8'
    ['webdriver.driver', 'headless.mode', 'chrome.switches', 'webdriver.chrome.driver',
     'reto.baseUrl'].each { key ->
        if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
    }
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
    finalizedBy 'aggregate', 'jacocoTestReport'
}
jacoco { toolVersion = '0.8.13' }
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
sonar {
    properties {
        property 'sonar.projectKey', 'reto-sqa-datepicker'
        property 'sonar.projectName', 'Reto SQA Datepicker'
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.sources', 'src/main/java'
        property 'sonar.tests', 'src/test/java'
        property 'sonar.java.binaries', 'build/classes/java/main'
        property 'sonar.java.test.binaries', 'build/classes/java/test'
        property 'sonar.junit.reportPaths', 'build/test-results/test'
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
    }
}
